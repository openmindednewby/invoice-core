# Generated by personalServerNotes/scripts/npm-oidc/rollout.mjs (ROTATE-1 D-ROT-5). Edit the template, not this copy.
name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm 11 (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@11 && npm --version
      - name: Tag matches package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }
      - name: Build file:../ sibling dependencies
        run: |
          build_siblings() {
            for dep in $(node -e "const p=require('$1/package.json');const all={...p.dependencies,...p.devDependencies,...p.peerDependencies};for(const v of Object.values(all))if(String(v).startsWith('file:../'))console.log(String(v).slice(8))"); do
              dir="$(cd "$1/.." && pwd)/$dep"
              [ -d "$dir" ] && continue
              git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY_OWNER}/$dep.git" "$dir"
              build_siblings "$dir"
              (cd "$dir" && npm ci --no-audit --no-fund && npm run build)
            done
          }
          build_siblings "$PWD"
      - run: npm ci --no-audit --no-fund
      - name: Publish (prepublishOnly builds and tests; verbose shows the OIDC exchange result)
        run: npm publish --access public --loglevel verbose
